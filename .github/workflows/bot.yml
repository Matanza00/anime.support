# The news bot, running in the cloud (no laptop needed). Started on time by the Cloudflare timer
# (worker/index.js), with GitHub's own schedule below as a backup.
#   every 2 hours: fetch feeds → AI drafts + original artwork → deploy approved articles → Facebook
#   daily:          anime catalog from AniList (shows, airing schedule, where to watch, overviews)
#   weekly (Sunday): AniList trending + learn from views + rank sources
# Run a task by hand: Actions tab → "News bot" → Run workflow, or put the task name on the first
# line of .github/run-bot.txt and push.
# Times are UTC. Run any task by hand: Actions tab → "News bot" → Run workflow.
name: News bot

on:
  schedule:
    - cron: '17 */2 * * *'
    - cron: '41 22 * * 0'
    - cron: '41 1 * * *' # daily anime catalog (backup; the Cloudflare timer is the main trigger)
  push: # editing .github/run-bot.txt starts the task named on its first line
    branches: [main]
    paths: ['.github/run-bot.txt']
  workflow_dispatch:
    inputs:
      task:
        description: 'Task to run'
        type: choice
        options: [collect-and-publish, collect, publish, optimize, catalog, seed]
        default: collect-and-publish

permissions:
  contents: write # to commit the publish marker

defaults:
  run:
    shell: bash

concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    environment: Env # your secrets live in the "Env" environment
    timeout-minutes: 45
    outputs:
      deploy: ${{ steps.publish.outputs.deploy || steps.catalog.outputs.deploy }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://openrouter.ai/api/v1' }}
      LLM_MODEL: ${{ vars.LLM_MODEL || 'openai/gpt-4o-mini' }}
      IMAGE_PROVIDER: ${{ vars.IMAGE_PROVIDER || 'openrouter' }}
      IMAGE_MODEL: ${{ vars.IMAGE_MODEL || 'google/gemini-2.5-flash-image' }}
      IMAGE_API_KEY: ${{ secrets.IMAGE_API_KEY }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      SITE_URL: https://anime.support
      DEPLOY_MODE: actions
      MAX_DRAFTS_PER_RUN: ${{ vars.MAX_DRAFTS_PER_RUN || '6' }}
      # Optional: publish high-confidence drafts without waiting for review (repo/environment variable)
      AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH || 'off' }}
      AUTO_PUBLISH_MIN_CONFIDENCE: ${{ vars.AUTO_PUBLISH_MIN_CONFIDENCE || '0.85' }}
      AUTO_PUBLISH_MAX_PER_DAY: ${{ vars.AUTO_PUBLISH_MAX_PER_DAY || '8' }}
    steps:
      - uses: actions/checkout@v4
      - name: Decide the task
        run: |
          case "${{ github.event_name }}/${{ github.event.schedule }}" in
            workflow_dispatch/*) TASK="${{ inputs.task }}" ;;
            push/*) TASK="$(head -n1 .github/run-bot.txt | grep -oE '^(collect-and-publish|collect|publish|optimize|catalog|seed)' || echo collect-and-publish)" ;;
            "schedule/41 1 * * *") TASK=catalog ;;
            "schedule/41 22 * * 0") TASK=optimize ;;
            *) TASK=collect-and-publish ;;
          esac
          echo "TASK=$TASK" >> "$GITHUB_ENV"
          echo "Task: $TASK" | tee "$RUNNER_TEMP/report.txt"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bot/package-lock.json
      - run: npm ci
        working-directory: bot
      - name: Git identity for the publish marker
        run: |
          git config user.name "anime.support bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Weekly optimise
        if: env.TASK == 'optimize'
        run: node src/index.js optimize 2>&1 | tee -a "$RUNNER_TEMP/report.txt"
        working-directory: bot

      - name: Anime catalog (AniList shows, schedule, overviews)
        id: catalog
        if: env.TASK == 'catalog'
        run: node src/index.js catalog 2>&1 | tee -a "$RUNNER_TEMP/report.txt"
        working-directory: bot

      - name: Publish launch articles
        if: env.TASK == 'seed'
        run: node src/index.js seed 2>&1 | tee -a "$RUNNER_TEMP/report.txt"
        working-directory: bot

      - name: Collect news and write drafts
        if: env.TASK == 'collect-and-publish' || env.TASK == 'collect'
        run: node src/index.js collect 2>&1 | tee -a "$RUNNER_TEMP/report.txt"
        working-directory: bot

      - name: Deploy approved articles + share to Facebook
        id: publish
        if: env.TASK == 'collect-and-publish' || env.TASK == 'publish'
        run: node src/index.js publish 2>&1 | tee -a "$RUNNER_TEMP/report.txt"
        working-directory: bot

      - name: Save bot report
        if: always()
        run: |
          mkdir -p .github/status
          {
            echo "# Last bot run: ${{ job.status }}"
            echo
            echo "- When: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- Trigger: ${{ github.event_name }}"
            echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo '```'
            tail -n 80 "$RUNNER_TEMP/report.txt" 2>/dev/null
            echo '```'
          } > .github/status/bot.md
          git add .github/status/bot.md
          git commit -m "status: bot ${{ job.status }}" || exit 0
          git pull --rebase --autostash -q origin main && git push -q origin HEAD:main || true

  deploy:
    needs: bot
    if: needs.bot.outputs.deploy == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
