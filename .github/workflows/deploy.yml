# Sets up the D1 database (first run), builds the Next.js site from it, and deploys to Cloudflare.
# Runs when site code changes, when the bot publishes, or by hand from the Actions tab.
name: Deploy site

on:
  push:
    branches: [main]
    paths: ['web/**', 'worker/**', 'database/**', 'wrangler.jsonc', '.github/workflows/deploy.yml']
  workflow_dispatch:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN: { required: false }
      CLOUDFLARE_ACCOUNT_ID: { required: false }

permissions:
  contents: write # to save the deploy report (.github/status/deploy.md)

defaults:
  run:
    shell: bash # = bash -eo pipefail: a failing command fails the step even when piped to tee

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: Env # your secrets live in the "Env" environment
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
      # Creator Studio sign-in and safety settings (all optional; each feature turns on when its values exist)
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID || secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      APPLE_SERVICES_ID: ${{ vars.APPLE_SERVICES_ID }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APPLE_KEY_ID: ${{ vars.APPLE_KEY_ID }}
      APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
      TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      NEXT_PUBLIC_GA4_ID: ${{ vars.GA4_ID }} # Google Analytics 4 Measurement ID (G-...)
      ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS || secrets.ADMIN_EMAILS }}
      HASH_SALT: ${{ secrets.HASH_SALT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # always the latest commit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Check secrets (names only, never values)
        run: |
          for n in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -n "${!n}" ]; then echo "$n: set"; else echo "$n: MISSING (add it under Settings → Secrets and variables → Actions → the Env environment)"; fi
          done | tee -a "$RUNNER_TEMP/report.txt"
          [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]

      - name: Database (create if missing, apply schema, launch articles)
        run: node database/setup.mjs 2>&1 | tee -a "$RUNNER_TEMP/report.txt"

      - run: npm ci
        working-directory: web
      - name: Build site (Next.js static export + images from D1)
        working-directory: web
        run: npm run build 2>&1 | tee -a "$RUNNER_TEMP/report.txt"

      - name: Deploy to Cloudflare
        run: npx --yes wrangler@4 deploy 2>&1 | tee -a "$RUNNER_TEMP/report.txt"

      - name: Remember what the live site contains
        run: node database/setup.mjs --mark-built 2>&1 | tee -a "$RUNNER_TEMP/report.txt"

      - name: Give the Cloudflare timer its GitHub token
        run: |
          if [ -n "$GH_DISPATCH_TOKEN" ]; then
            printf '%s' "$GH_DISPATCH_TOKEN" | npx --yes wrangler@4 secret put GH_DISPATCH_TOKEN 2>&1 | grep -v -i token | tee -a "$RUNNER_TEMP/report.txt"
            echo "Cloudflare timer: on" | tee -a "$RUNNER_TEMP/report.txt"
          else
            echo "Cloudflare timer: off (add the GH_DISPATCH_TOKEN secret to the Env environment)" | tee -a "$RUNNER_TEMP/report.txt"
          fi

      - name: Creator Studio settings (sign-in keys, admins)
        run: |
          for n in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET APPLE_SERVICES_ID APPLE_TEAM_ID APPLE_KEY_ID APPLE_PRIVATE_KEY TURNSTILE_SECRET ADMIN_EMAILS HASH_SALT; do
            if [ -n "${!n}" ]; then
              printf '%s' "${!n}" | npx --yes wrangler@4 secret put "$n" >/dev/null 2>&1 && echo "$n: set" || echo "$n: FAILED to set"
            else
              echo "$n: not set"
            fi
          done | tee -a "$RUNNER_TEMP/report.txt"
          [ -n "$GOOGLE_CLIENT_ID" ] && [ -n "$GOOGLE_CLIENT_SECRET" ] && echo "Google sign-in: on" || echo "Google sign-in: off (add GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET)"
          [ -n "$APPLE_SERVICES_ID" ] && [ -n "$APPLE_PRIVATE_KEY" ] && echo "Apple sign-in: on" || echo "Apple sign-in: off"

      - name: Save deploy report
        if: always()
        run: |
          mkdir -p .github/status
          {
            echo "# Last deploy: ${{ job.status }}"
            echo
            echo "- When: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- Commit: ${GITHUB_SHA::7}"
            echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo '```'
            tail -n 60 "$RUNNER_TEMP/report.txt" 2>/dev/null | sed -E 's/(token|Bearer)[^ ]*/\1 ***/Ig'
            echo '```'
          } > .github/status/deploy.md
          git config user.name "anime.support bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/status/deploy.md
          git commit -m "status: deploy ${{ job.status }}" || exit 0
          git pull --rebase --autostash -q origin main && git push -q origin HEAD:main || true
